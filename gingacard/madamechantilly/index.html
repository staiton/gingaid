<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Madame Chantilly by Marina Andrade</title>
  <meta name="theme-color" content="#8A5050">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Great+Vibes&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --rose-light: #F2DDD8;
      --rose: #D4A5A5;
      --rose-dark: #B07878;
      --rose-deep: #8A5050;
      --gold: #B8954A;
      --gold-light: #D4B56A;
      --gold-bright: #E8C878;
      --gold-dim: rgba(184, 149, 74, 0.15);
      --raspberry: #C44569;
      --cream: #FDF6F0;
      --cream-warm: #F8EDE5;
      --text-primary: #5C3030;
      --text-body: #6B4040;
      --text-muted: #8A6868;
      --text-label: #B8954A;
      --text-dim: #b09898;
      --whatsapp: #25d366;
      --instagram: #e1306c;
    }

    html { font-size: 16px; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--rose-light);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
    }

    .container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0 24px 36px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =============================================
       HEADER
       ============================================= */
    .header {
      text-align: center;
      padding-top: 44px;
      margin-bottom: 0;
      opacity: 0;
      animation: fadeDown 0.8s ease forwards;
    }

    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 22px;
    }

    .logo-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--rose-dark);
      overflow: visible;
      box-shadow:
        0 6px 30px rgba(184, 149, 74, 0.15),
        0 0 0 5px var(--rose-light),
        0 0 0 6.5px var(--gold-light);
    }

    .logo-icon {
      position: absolute;
      top: -6px;
      right: 2px;
      width: 38px;
      height: 38px;
      z-index: 5;
    }

    .logo-icon svg {
      width: 100%;
      height: 100%;
    }

    .logo-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .logo-madame {
      font-family: 'Playfair Display', serif;
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-bright);
    }

    .logo-chantilly {
      font-family: 'Great Vibes', cursive;
      font-size: 1.5rem;
      color: var(--cream);
      line-height: 1.1;
    }

    .logo-ornament {
      margin-top: 2px;
    }

    .logo-ornament svg {
      width: 36px;
      height: 12px;
    }

    .logo-ring img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 50%;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-weight: 500;
      font-size: 1.55rem;
      letter-spacing: 2px;
      color: var(--text-primary);
      margin-bottom: 0;
      line-height: 1.3;
    }

    .brand-name .chantilly {
      font-family: 'Great Vibes', cursive;
      font-size: 2.1rem;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .brand-sub {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 0.72rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-body);
      margin-top: 2px;
      opacity: 0;
      animation: fadeDown 0.8s ease 0.2s forwards;
    }

    /* =============================================
       DIVIDER
       ============================================= */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px auto;
      opacity: 0;
      animation: fadeDown 0.7s ease 0.3s forwards;
    }

    .divider-line {
      width: 22px;
      height: 1px;
      background: var(--gold);
    }

    .divider-dot {
      width: 5px;
      height: 5px;
      background: var(--gold);
      border-radius: 50%;
    }

    /* =============================================
       SERVICOS
       ============================================= */
    .services {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-primary);
      max-width: 300px;
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeDown 0.7s ease 0.35s forwards;
    }

    .services .gold {
      color: var(--gold);
      font-style: normal;
      font-weight: 600;
    }

    .services-line {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: var(--text-body);
      margin-bottom: 0;
      opacity: 0;
      animation: fadeDown 0.7s ease 0.4s forwards;
    }

    .services-line .dot {
      display: inline-block;
      width: 3px;
      height: 3px;
      background: var(--gold);
      border-radius: 50%;
      vertical-align: middle;
      margin: 0 8px;
    }

    .divider-2 {
      width: 50px;
      height: 1px;
      background: var(--gold);
      margin: 22px auto;
      opacity: 0;
      animation: fadeDown 0.6s ease 0.45s forwards;
    }

    /* =============================================
       LINKS
       ============================================= */
    .links-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--cream);
      border: 1px solid var(--gold-dim);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-primary);
      position: relative;
      overflow: hidden;
      transition: all 0.35s ease;
      opacity: 0;
      transform: translateY(15px);
    }

    .link-card:nth-child(1) { animation: fadeUp 0.6s ease 0.55s forwards; }
    .link-card:nth-child(2) { animation: fadeUp 0.6s ease 0.7s forwards; }
    .link-card:nth-child(3) { animation: fadeUp 0.6s ease 0.85s forwards; }

    .link-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 0 2px 2px 0;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .link-card.whatsapp::before { background: var(--whatsapp); }
    .link-card.instagram::before { background: var(--instagram); }
    .link-card.location::before { background: var(--gold); }

    .link-card:hover::before,
    .link-card:active::before { opacity: 1; }

    .link-card:hover {
      background: var(--cream-warm);
      border-color: var(--gold-light);
      box-shadow: 0 4px 20px rgba(184, 149, 74, 0.1);
      transform: translateY(-1px);
    }

    .link-card:active {
      transform: scale(0.98) translateY(0);
    }

    .link-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .link-card:hover .link-icon-wrap { transform: scale(1.05); }

    .whatsapp .link-icon-wrap {
      background: rgba(37, 211, 102, 0.08);
      border: 1px solid rgba(37, 211, 102, 0.15);
    }
    .instagram .link-icon-wrap {
      background: rgba(225, 48, 108, 0.08);
      border: 1px solid rgba(225, 48, 108, 0.15);
    }
    .location .link-icon-wrap {
      background: var(--gold-dim);
      border: 1px solid rgba(184, 149, 74, 0.2);
    }

    .link-icon-wrap svg { width: 22px; height: 22px; }
    .whatsapp .link-icon-wrap svg { fill: var(--whatsapp); }
    .instagram .link-icon-wrap svg { fill: var(--instagram); }
    .location .link-icon-wrap svg { fill: var(--gold); }

    .link-text { flex: 1; }

    .link-title {
      font-family: 'Playfair Display', serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .link-desc {
      font-size: 0.72rem;
      color: var(--text-body);
      font-weight: 500;
    }

    .link-arrow {
      color: var(--text-muted);
      font-size: 1.2rem;
      transition: all 0.3s ease;
      font-weight: 300;
    }

    .link-card:hover .link-arrow {
      transform: translateX(4px);
      color: var(--gold);
    }

    /* =============================================
       ENDERECO — cores ajustadas para contraste
       ============================================= */
    .address-block {
      width: 100%;
      background: var(--rose-deep);
      border-radius: 16px;
      padding: 20px 22px;
      margin-top: 14px;
      border: 1px solid var(--gold);
      opacity: 0;
      animation: fadeUp 0.6s ease 0.95s forwards;
    }

    .address-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin-bottom: 8px;
    }

    .address-text {
      font-family: 'Playfair Display', serif;
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1.65;
      color: var(--cream);
    }

    /* =============================================
       FOOTER
       ============================================= */
    .footer {
      margin-top: auto;
      padding-top: 28px;
      text-align: center;
      opacity: 0;
      animation: fadeDown 0.6s ease 1.1s forwards;
    }

    .footer-ornament {
      margin-bottom: 12px;
    }

    .footer-ornament svg {
      width: 48px;
      height: 14px;
    }

    .footer-tagline {
      font-family: 'Great Vibes', cursive;
      font-size: 1.15rem;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .footer-year {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.58rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* =============================================
       ANIMACOES
       ============================================= */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 360px) {
      .brand-name { font-size: 1.35rem; }
      .brand-name .chantilly { font-size: 1.85rem; }
      .logo-ring { width: 120px; height: 120px; }
      .logo-madame { font-size: 0.85rem; }
      .logo-chantilly { font-size: 1.3rem; }
      .link-card { padding: 14px 16px; }
    }

    @media (min-height: 800px) {
      .header { padding-top: 56px; }
    }
  </style>
</head>
