<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eider Lima — Studio Art Oral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;0,700;1,300;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f3ef;
      --bg-warm: #efece6;
      --navy: #383d5b;
      --navy-light: #5a5f7a;
      --navy-muted: #8a8da3;
      --navy-faint: #c5c7d4;
      --navy-ghost: #ddd9d0;
      --gold: #c9a96e;
      --gold-light: #d4ba8a;
      --gold-faint: #ebe4d4;
      --text-primary: #383d5b;
      --text-body: #5a5f7a;
      --text-muted: #8a8da3;
      --whatsapp: #25d366;
      --instagram: #e1306c;
      --google: #4285f4;
}

    html {
      font-size: 16px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
    }

    .container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0 24px 40px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top decorative line */
    .top-accent {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--navy), var(--gold), var(--navy), transparent);
      opacity: 0.6;
      margin-bottom: 0;
    }

    /* Header */
    .header {
      text-align: center;
      padding-top: 40px;
      margin-bottom: 4px;
      opacity: 0;
      animation: fadeDown 0.8s ease forwards;
    }

    /* Photo placeholder */
    .photo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 24px;
    }

    .photo-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 2px solid var(--navy-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--bg-warm);
      overflow: hidden;
      box-shadow:
        0 4px 20px rgba(56, 61, 91, 0.08),
        0 1px 4px rgba(56, 61, 91, 0.04);
    }

    .photo-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid var(--gold-faint);
      animation: rotateRing 20s linear infinite;
      border-top-color: var(--gold);
      border-right-color: transparent;
      border-bottom-color: transparent;
    }

    @keyframes rotateRing {
      to { transform: rotate(360deg); }
    }

    

   
    .photo-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    

    .doctor-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: var(--navy);
      margin-bottom: 6px;
      line-height: 1.1;
    }

    .clinic-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 1.1rem;
      letter-spacing: 3px;
      color: var(--gold);
      margin-bottom: 0;
      opacity: 0;
      animation: fadeDown 0.8s ease 0.2s forwards;
    }

    /* Decorative divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px auto;
      opacity: 0;
      animation: fadeDown 0.8s ease 0.3s forwards;
    }

    .divider-line {
      width: 30px;
      height: 1px;
      background: var(--navy-faint);
    }

    .divider-diamond {
      width: 6px;
      height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
    }

    /* Tagline */
    .tagline {
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-style: italic;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--navy-light);
      max-width: 320px;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeDown 0.8s ease 0.4s forwards;
    }

    /* Services */
    .services {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeDown 0.8s ease 0.5s forwards;
    }

    .service-tag {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--navy-muted);
      padding: 6px 14px;
      border: 1px solid var(--navy-ghost);
      border-radius: 20px;
      background: var(--bg);
      transition: all 0.3s ease;
    }

    .service-tag:hover {
      border-color: var(--gold-light);
      color: var(--navy);
      background: var(--gold-faint);
    }

    /* Links */
    .links-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--bg);
      border: 1px solid var(--navy-ghost);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-primary);
      position: relative;
      overflow: hidden;
      transition: all 0.35s ease;
      opacity: 0;
      transform: translateY(15px);
    }

    .link-card:nth-child(1) { animation: fadeUp 0.6s ease 0.65s forwards; }
    .link-card:nth-child(2) { animation: fadeUp 0.6s ease 0.8s forwards; }
    .link-card:nth-child(3) { animation: fadeUp 0.6s ease 0.95s forwards; }

    .link-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 0 2px 2px 0;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .link-card.whatsapp::before { background: var(--whatsapp); }
    .link-card.instagram::before { background: var(--instagram); }
    .link-card.google::before { background: var(--google); }

    .link-card:hover::before,
    .link-card:active::before {
      opacity: 1;
    }

    .link-card:hover {
      border-color: var(--navy-faint);
      box-shadow: 0 4px 16px rgba(56, 61, 91, 0.06);
      transform: translateY(-1px);
    }

    .link-card:active {
      transform: scale(0.98) translateY(0);
    }

    .link-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .link-card:hover .link-icon-wrap {
      transform: scale(1.05);
    }

    .whatsapp .link-icon-wrap {
      background: rgba(37, 211, 102, 0.08);
      border: 1px solid rgba(37, 211, 102, 0.15);
    }
    .instagram .link-icon-wrap {
      background: rgba(225, 48, 108, 0.08);
      border: 1px solid rgba(225, 48, 108, 0.15);
    }
    .google .link-icon-wrap {
      background: rgba(66, 133, 244, 0.08);
      border: 1px solid rgba(66, 133, 244, 0.15);
    }

    .link-icon-wrap svg {
      width: 22px;
      height: 22px;
    }

    .whatsapp .link-icon-wrap svg { fill: var(--whatsapp); }
    .instagram .link-icon-wrap svg { fill: var(--instagram); }
    .google .link-icon-wrap svg { fill: var(--google); }

    .link-text {
      flex: 1;
    }

    .link-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--navy);
      margin-bottom: 2px;
    }

    .link-desc {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .link-arrow {
      color: var(--navy-faint);
      font-size: 1.2rem;
      transition: all 0.3s ease;
      font-weight: 300;
    }

    .link-card:hover .link-arrow {
      transform: translateX(4px);
      color: var(--gold);
    }

    /* Footer */
    .footer {
      margin-top: auto;
      padding-top: 40px;
      text-align: center;
      opacity: 0;
      animation: fadeDown 0.8s ease 1.1s forwards;
    }

    .footer-line {
      width: 40px;
      height: 1px;
      background: var(--navy-ghost);
      margin: 0 auto 14px;
    }

    .footer-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--navy-muted);
    }

    .footer-year {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.6rem;
      color: var(--navy-faint);
      margin-top: 6px;
      letter-spacing: 2px;
    }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 360px) {
      .doctor-name { font-size: 1.8rem; }
      .clinic-name { font-size: 0.95rem; }
      .tagline { font-size: 0.9rem; }
      .link-card { padding: 14px 16px; }
      .photo-ring { width: 110px; height: 110px; }
    }

    @media (min-height: 800px) {
      .header { padding-top: 52px; }
    }
  </style>
</head>
